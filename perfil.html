<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil · Cabañas del Bosque</title>
  <meta name="description" content="Gestiona tu perfil y consulta tu historial de reservas." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8b5e34', 'primary-light': '#c08552', 'primary-dark': '#6b4423',
            secondary: '#3d5f3d', 'secondary-light': '#6b8e4e',
            accent: '#d4a574',
            'background-light': '#faf6f1', 'background-cream': '#f3ead9',
            'background-soft': '#ede0ce', 'background-dark': '#2c1f15', 'background-card': '#ffffff',
            muted: '#6b5d4f', border: '#e0d2bd'
          },
          fontFamily: { display: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="perfil" class="bg-background-light text-gray-800 font-sans">

  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <div id="noLoguedado" class="hidden text-center py-20">
      <p class="text-muted mb-4">Necesitas iniciar sesión para ver tu perfil.</p>
      <a href="inicio-sesion.html" class="btn-primary">Iniciar sesión</a>
    </div>

    <div id="perfilContent" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- SIDEBAR PERFIL -->
        <aside class="lg:col-span-1">
          <div class="bg-white rounded-2xl shadow-md border border-border overflow-hidden sticky top-24">
            <div class="bg-gradient-to-br from-primary to-primary-dark p-6 text-center text-white">
              <div class="img-fallback w-24 h-24 rounded-full mx-auto mb-3 ring-4 ring-white/30 overflow-hidden" style="background-color:rgba(255,255,255,0.2);">
                <img id="userFoto" src="" alt="" class="w-full h-full object-cover relative z-10" loading="lazy"/>
              </div>
              <p id="userNombre" class="font-display text-xl font-bold"></p>
              <p id="userEmail" class="text-sm text-white/80"></p>
            </div>
            <div class="p-5 space-y-3 text-sm">
              <div class="flex items-center gap-2 text-muted">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <span id="userTelefono">-</span>
              </div>
              <div class="flex items-center gap-2 text-muted">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0"/></svg>
                <span id="userDni">-</span>
              </div>
              <div class="flex items-center gap-2 text-muted">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span id="userAntiguedad">-</span>
              </div>
            </div>
            <div class="border-t border-border p-4 space-y-2">
              <button id="btnEditar" class="btn-outline w-full text-sm">Editar perfil</button>
              <button id="btnLogout2" class="btn-ghost w-full text-sm text-red-600 hover:bg-red-50">Cerrar sesión</button>
            </div>
          </div>
        </aside>

        <!-- HISTORIAL DE RESERVAS -->
        <section class="lg:col-span-2" id="reservas">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <h2 class="font-display text-2xl font-bold">Historial de reservas</h2>
            <a href="reserva.html" class="btn-primary text-sm">Nueva reserva</a>
          </div>

          <!-- Filtros -->
          <div class="flex flex-wrap gap-2 mb-5">
            <button data-filtro="todas" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-primary text-white">Todas</button>
            <button data-filtro="pendiente" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border border-border text-gray-700">Pendientes</button>
            <button data-filtro="confirmada" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border border-border text-gray-700">Confirmadas</button>
            <button data-filtro="pagada" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border border-border text-gray-700">Pagadas</button>
            <button data-filtro="cancelada" class="filtro-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border border-border text-gray-700">Canceladas</button>
          </div>

          <div id="reservasList" class="space-y-4">
            <!-- Inyectado por JS -->
          </div>
        </section>
      </div>
    </div>

  </main>

  <div id="appFooter"></div>

  <script src="main.js"></script>
  <script>
    let filtroActual = 'todas';

    function pageInit() {
      const u = Auth.current();
      if (!u) {
        document.getElementById('noLoguedado').classList.remove('hidden');
        return;
      }
      document.getElementById('perfilContent').classList.remove('hidden');

      // Pintar usuario
      document.getElementById('userFoto').src = u.foto;
      document.getElementById('userNombre').textContent = u.nombre;
      document.getElementById('userEmail').textContent = u.email;
      document.getElementById('userTelefono').textContent = u.telefono || 'Sin teléfono';
      document.getElementById('userDni').textContent = u.dni ? 'DNI ' + u.dni : 'Sin DNI';
      const dias = Math.floor((Date.now() - u.creado) / 86400000);
      document.getElementById('userAntiguedad').textContent = dias < 30 ? 'Nuevo en el bosque' : (dias < 365 ? Math.floor(dias/30) + ' meses con nosotros' : Math.floor(dias/365) + ' años con nosotros');

      // Renderizar reservas
      pintarReservas();

      // Filtros
      document.querySelectorAll('.filtro-btn').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.filtro-btn').forEach(x => {
            x.classList.remove('bg-primary', 'text-white');
            x.classList.add('bg-white', 'border', 'border-border', 'text-gray-700');
          });
          b.classList.add('bg-primary', 'text-white');
          b.classList.remove('bg-white', 'border', 'border-border', 'text-gray-700');
          filtroActual = b.dataset.filtro;
          pintarReservas();
        });
      });

      // Editar perfil
      document.getElementById('btnEditar').addEventListener('click', () => {
        const u2 = Auth.current();
        UI.modal({
          titulo: 'Editar perfil',
          mensaje: 'Actualiza tu información personal',
          body: `
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-semibold mb-1">Nombre completo</label>
                <input id="editNombre" type="text" class="input-field" value="${u2.nombre}" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Email</label>
                <input id="editEmail" type="email" class="input-field" value="${u2.email}" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Teléfono</label>
                <input id="editTelefono" type="tel" class="input-field" value="${u2.telefono || ''}" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">DNI</label>
                <input id="editDni" type="text" class="input-field" value="${u2.dni || ''}" />
              </div>
            </div>
          `,
          cancelLabel: 'Cancelar',
          confirmLabel: 'Guardar cambios',
          confirmClass: 'btn-primary',
          onConfirm: () => {
            const data = {
              nombre: document.getElementById('editNombre').value.trim(),
              email: document.getElementById('editEmail').value.trim(),
              telefono: document.getElementById('editTelefono').value.trim(),
              dni: document.getElementById('editDni').value.trim()
            };
            if (!data.nombre || !data.email) {
              UI.toast('Nombre y email son obligatorios', 'error');
              return;
            }
            const r = Auth.updateProfile(u2.id, data);
            if (r.ok) {
              UI.toast('Perfil actualizado', 'success');
              setTimeout(() => location.reload(), 600);
            } else {
              UI.toast(r.error, 'error');
            }
          }
        });
      });

      // Logout
      document.getElementById('btnLogout2').addEventListener('click', () => {
        UI.modal({
          titulo: '¿Cerrar sesión?',
          mensaje: 'Tendrás que iniciar sesión nuevamente para ver tus reservas.',
          confirmLabel: 'Sí, cerrar sesión',
          confirmClass: 'btn-primary bg-red-600 hover:bg-red-700',
          iconBg: 'bg-red-100',
          onConfirm: () => {
            Auth.logout();
            UI.toast('Sesión cerrada', 'success');
            setTimeout(() => window.location.href = 'index.html', 600);
          }
        });
      });
    }

    function pintarReservas() {
      const u = Auth.current();
      let reservas = Reservas.listByUser(u.id);
      if (filtroActual !== 'todas') {
        reservas = reservas.filter(r => r.estado === filtroActual);
      }

      const cont = document.getElementById('reservasList');
      if (reservas.length === 0) {
        cont.innerHTML = `
          <div class="bg-white rounded-2xl border border-border p-10 text-center">
            <svg class="w-16 h-16 mx-auto mb-3 text-muted opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p class="font-bold text-gray-900 mb-1">No tienes reservas ${filtroActual !== 'todas' ? filtroActual + 's' : ''}</p>
            <p class="text-sm text-muted mb-4">Comienza tu próxima aventura en el bosque</p>
            <a href="reserva.html" class="btn-primary">Reservar ahora</a>
          </div>
        `;
        return;
      }

      cont.innerHTML = reservas.map(r => {
        const cabana = Cabanas.getById(r.cabanaId);
        const badgeClass = {
          pendiente: 'badge-pendiente',
          confirmada: 'badge-confirmada',
          pagada: 'badge-pagada',
          cancelada: 'badge-cancelada',
          completada: 'badge-completada'
        }[r.estado] || 'badge-confirmada';
        return `
          <article class="bg-white rounded-2xl shadow-sm border border-border overflow-hidden card-hover">
            <a href="detalle-reserva.html?id=${r.id}" class="block">
              <div class="grid grid-cols-1 sm:grid-cols-[180px_1fr] gap-0">
                <div class="aspect-square sm:aspect-auto overflow-hidden bg-background-cream img-fallback" style="background-color:#ede0ce;">
                  <img src="${cabana.imagenes[0]}" alt="${cabana.nombre}" class="w-full h-full object-cover card-image relative z-10" loading="lazy"/>
                </div>
                <div class="p-5">
                  <div class="flex items-start justify-between gap-3 mb-2">
                    <div>
                      <p class="text-xs uppercase tracking-wider text-muted font-semibold">${r.codigo}</p>
                      <h3 class="font-display text-lg font-bold">${cabana.nombre}</h3>
                    </div>
                    <span class="badge ${badgeClass} shrink-0">${r.estado}</span>
                  </div>
                  <p class="text-sm text-muted mb-3">${UI.formatFecha(r.fechaEntrada)} → ${UI.formatFecha(r.fechaSalida)} · ${UI.diffDias(r.fechaEntrada, r.fechaSalida)} noches · ${r.huespedes} huéspedes</p>
                  <div class="flex items-center justify-between">
                    <p class="font-bold text-primary">${UI.formatMoneda(r.total)}</p>
                    <span class="text-sm text-primary font-semibold flex items-center gap-1">
                      Ver detalle
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </span>
                  </div>
                </div>
              </div>
            </a>
          </article>
        `;
      }).join('');
    }
  </script>
</body>
</html>
